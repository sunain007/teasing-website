<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I love you too 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>I love you too <span class="heart">💖</span></h1>
  <p class="hint">I knew you'd say yes 😘</p>
</main>
<script>
const emojis = ["💖","💕","💗","💘","❤️","💞"];
function spawn(){
  const s = document.createElement('span');
  s.className = 'floaty';
  s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  s.style.left = Math.random()*100 + 'vw';
  s.style.animationDuration = 4 + Math.random()*4 + 's';
  s.style.fontSize = 1.2 + Math.random()*2 + 'rem';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 8500);
}
setInterval(spawn, 300);
for (let i = 0; i < 15; i++) setTimeout(spawn, i*100);
</script>
</body>
</html>
